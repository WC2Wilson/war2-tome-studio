name: Build Windows EXE Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x86'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build TOME Studio
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name War2TOMEStudio tome_workbench.py
          Get-FileHash dist\War2TOMEStudio.exe -Algorithm SHA256 | Format-List

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0
          TITLE: Warcraft II TOME Studio - Windows EXE
        run: |
          $asset = "dist\War2TOMEStudio.exe"
          $notes = "First standalone Windows EXE release of the TOME Studio source workbench. Opens and rebuilds user-supplied TOME.1 through TOME.4 archives; no game archives are bundled."
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $asset --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:TAG $asset --target $env:GITHUB_SHA --title $env:TITLE --notes $notes --repo $env:GITHUB_REPOSITORY
          }
